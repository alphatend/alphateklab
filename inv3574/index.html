<!--
  Página privada (25-oct-2026). GitHub Pages no pide contraseña, así que todo el contenido y las imágenes están
  comprimidos y cifrados (AES-256-GCM; la llave sale de la contraseña con PBKDF2-SHA256, 600.000 vueltas, sal pública
  en acceso.json). Aquí solo está la puerta y el lector. La contraseña no está en el código ni en el repositorio.
  Lo arma ~/proyectos/cuire/inv3574/armar.mjs, fuera del repo.
-->
<style>
/* Dirección (25-oct-2026): informe sobrio. La letra es la del sistema (San Francisco en iPhone y Mac, Segoe en
   Windows; Inter donde no hay ninguna de las dos), papel cálido y un solo acento rojo oscuro. Los colores de la finca,
   los vecinos y el Estado son los mismos del mapa. Sin adornos: lo que se mueve, se mueve porque ayuda a leer. */
@font-face { font-family: "Inter"; src: url("../assets/fuentes/inter-latin.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
:root {
  color-scheme: light;
  --papel: #f3efe7; --hoja: #fffdf9; --tinta: #1e1a15; --tinta-2: #3d362e; --tinta-3: #665c50; --linea: #e4dccf; --linea-2: #cdc2b1;
  --acento: #9b2a1e; --acento-hondo: #7c2015; --acento-suave: #f5e4df; --sobre-acento: #fff;
  --verde: #2e6638; --verde-suave: #e5efe4; --morado: #663b86; --morado-suave: #efe7f4; --ocre: #83560f; --ocre-suave: #f5ead8;
  --sombra: 0 1px 0 rgba(60, 40, 10, .04), 0 14px 34px -26px rgba(60, 40, 10, .45);
  --f-texto: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-titulo: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Inter", Roboto, "Helvetica Neue", Arial, sans-serif; --f-ui: var(--f-texto);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --papel: #14120f; --hoja: #1d1a16; --tinta: #f0eae0; --tinta-2: #d6cdc0; --tinta-3: #ab9f8f; --linea: #352f28; --linea-2: #4a4239;
    --acento: #ee9384; --acento-hondo: #f5ada1; --acento-suave: #3a211c; --sobre-acento: #1e120e;
    --verde: #93cc9a; --verde-suave: #1d2b1f; --morado: #cdaee6; --morado-suave: #2a2232; --ocre: #e0b672; --ocre-suave: #322819;
    --sombra: 0 1px 0 rgba(0, 0, 0, .3), 0 14px 34px -26px rgba(0, 0, 0, .8);
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
body { margin: 0; background: var(--papel); color: var(--tinta); font: 400 1.0625rem/1.65 var(--f-texto); -webkit-text-size-adjust: 100%; }
main { max-width: 880px; margin: 0 auto; padding: 0 16px 72px; counter-reset: sec; }
h1, h2, h3 { font-family: var(--f-titulo); font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; text-wrap: balance; }
p, li { text-wrap: pretty; }
a { color: var(--acento); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; border-radius: 4px; }

::selection { background: var(--acento-suave); color: var(--tinta); }
button { color: inherit; }

/* Puerta */
.puerta { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
.puerta__c { position: relative; width: 100%; max-width: 400px; background: var(--hoja); border: 1px solid var(--linea); border-radius: 6px; padding: 34px 28px 30px; box-shadow: var(--sombra); }
.puerta__c::before { content: ""; position: absolute; inset: 6px; border: 1px solid var(--linea); border-radius: 3px; pointer-events: none; }
.puerta__m { margin: 0 0 10px; font: 700 .7rem var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--acento); }
.puerta__c h1 { font-size: 1.9rem; margin: 0 0 6px; }
.puerta__c p { color: var(--tinta-3); margin: 0 0 20px; font-size: .95rem; }
.puerta label { display: block; font: 650 .85rem var(--f-ui); margin-bottom: 6px; }
.puerta input { position: relative; width: 100%; font: inherit; color: var(--tinta); padding: 12px 14px; border: 1px solid var(--linea-2); border-radius: 6px; background: var(--hoja); transition: border-color .2s; }
.puerta input:focus { border-color: var(--acento); }
.puerta button { position: relative; margin-top: 12px; width: 100%; font: 650 1rem var(--f-ui); padding: 13px; border: 0; border-radius: 6px; background: var(--acento); color: var(--sobre-acento); cursor: pointer; transition: background .2s; }
.puerta button:hover { background: var(--acento-hondo); }
.puerta button:disabled { opacity: .7; cursor: progress; }
.puerta__e { color: var(--acento); font-size: .9rem; margin: 10px 0 0; }

/* Cabecera */
.cab { padding: 44px 0 4px; }
.cab__marca { margin: 0; display: flex; align-items: center; gap: 12px; font: 700 .72rem var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--acento); }
.cab__marca::after { content: ""; flex: 1; height: 1px; background: var(--linea-2); }
.cab__t { font-size: clamp(2.6rem, 9vw, 4.2rem); margin: 14px 0 6px; letter-spacing: -0.035em; }
.cab__sub { margin: 0; font: 400 1.15rem/1.4 var(--f-titulo); color: var(--tinta-2); letter-spacing: -0.01em; }
.registro { display: grid; grid-template-columns: 1fr 1fr; margin: 24px 0 0; border-block: 1px solid var(--linea-2); }
@media (min-width: 640px) { .registro { grid-template-columns: repeat(4, 1fr); } }
.registro div { padding: 11px 12px 11px 0; }
.registro dt { font: 700 .68rem var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--tinta-3); }
.registro dd { margin: 3px 0 0; font: 600 1.05rem/1.3 var(--f-titulo); letter-spacing: -0.01em; }
.cab__tesis { margin: 22px 0 0; max-width: 60ch; padding-left: 16px; border-left: 3px solid var(--acento); font: 500 1.15rem/1.5 var(--f-titulo); letter-spacing: -0.01em; }
.cab__acciones { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.boton { display: inline-flex; align-items: center; justify-content: center; font: 650 .95rem var(--f-ui); text-decoration: none; padding: 11px 18px; border-radius: 6px; border: 1px solid var(--acento); background: var(--acento); color: var(--sobre-acento); cursor: pointer; transition: background .2s, color .2s; }
.boton:hover { background: var(--acento-hondo); border-color: var(--acento-hondo); }
.boton:disabled { opacity: .6; cursor: progress; }
@media (max-width: 520px) { .cab__acciones .boton { flex: 1 1 100%; } }
.boton--2 { background: transparent; color: var(--acento); }
.boton--2:hover { background: var(--acento-suave); color: var(--acento); }
.cab__fecha { margin: 16px 0 0; color: var(--tinta-3); font-size: .88rem; }

/* Índice: marca la sección que se está leyendo; la barra de arriba es el avance de la lectura */
.indice { position: sticky; top: 0; z-index: 5; display: flex; gap: 2px; overflow-x: auto; margin: 24px -16px 0; padding: 9px 16px; background: color-mix(in srgb, var(--papel) 90%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--linea); scrollbar-width: none; }
.indice::-webkit-scrollbar { display: none; }
.indice a { flex: none; text-decoration: none; color: var(--tinta-2); padding: 7px 12px; border-radius: 99px; font: 650 .86rem var(--f-ui); transition: background .2s, color .2s; }
.indice a:hover { color: var(--acento); }
.indice a[aria-current="true"] { background: var(--tinta); color: var(--papel); }
.progreso { position: fixed; inset: 0 0 auto; height: 2px; background: var(--acento); transform: scaleX(0); transform-origin: 0 50%; z-index: 7; pointer-events: none; }
.salir { position: fixed; right: 12px; bottom: 12px; z-index: 6; font: 650 .85rem var(--f-ui); background: var(--hoja); color: var(--tinta-2); border: 1px solid var(--linea-2); border-radius: 99px; padding: 8px 14px; cursor: pointer; box-shadow: var(--sombra); transition: border-color .2s, color .2s; }
.salir:hover { border-color: var(--acento); color: var(--acento); }

/* Bloques: cada sección es una hoja numerada */
.bloque { counter-increment: sec; background: var(--hoja); border: 1px solid var(--linea); border-radius: 8px; padding: 26px 18px; margin: 18px 0; scroll-margin-top: 66px; box-shadow: var(--sombra); }
@media (min-width: 700px) { .bloque { padding: 34px 38px; } }
.bloque > h2 { font-size: clamp(1.5rem, 4.4vw, 2rem); margin: 0 0 14px; }
.bloque > h2::before { content: "§ " counter(sec); display: block; margin-bottom: 6px; font: 700 .72rem var(--f-ui); letter-spacing: .12em; color: var(--acento); }
.bloque h3 { font-size: 1.22rem; margin: 30px 0 8px; }
.nota { color: var(--tinta-3); font-size: .95rem; }
.estado { display: grid; gap: 12px; grid-template-columns: 1fr; margin-bottom: 4px; }
@media (min-width: 640px) { .estado { grid-template-columns: 1fr 1fr; } }
.ficha { display: flex; flex-direction: column; gap: 3px; padding: 14px 16px 15px 18px; background: var(--papel); border-radius: 4px; border-left: 3px solid var(--c); }
.ficha strong { font: 650 1.1rem/1.3 var(--f-titulo); letter-spacing: -0.01em; }
.ficha span:last-child { color: var(--tinta-2); font-size: .95rem; }
.ficha__e { font: 700 .68rem var(--f-ui); text-transform: uppercase; letter-spacing: .12em; color: var(--c); }
.ficha--no { --c: var(--ocre); } .ficha--si { --c: var(--verde); } .ficha--prob { --c: var(--tinta-3); }
.ficha--aviso { --c: var(--acento); background: var(--acento-suave); }

/* Figuras */
.fig { margin: 16px 0 0; position: relative; }
.fig img { display: block; width: 100%; height: auto; border-radius: 4px; border: 1px solid var(--linea); background: var(--papel); min-height: 120px; }
.fig--chica img { max-width: 620px; }
.ver { margin-top: 10px; font: 650 .88rem var(--f-ui); background: transparent; border: 1px solid var(--linea-2); color: var(--acento); padding: 8px 14px; border-radius: 99px; cursor: pointer; transition: border-color .2s, background .2s; }
.ver:hover { border-color: var(--acento); background: var(--acento-suave); }

/* Historia: una línea con los hechos clave marcados */
.linea { list-style: none; margin: 12px 0 0; padding: 0; position: relative; }
.linea::before { content: ""; position: absolute; left: 75px; top: 14px; bottom: 14px; width: 1px; background: var(--linea-2); }
.linea li { position: relative; display: grid; grid-template-columns: 60px 1fr; gap: 30px; padding: 9px 0; }
.linea li::before { content: ""; position: absolute; left: 71px; top: 17px; width: 9px; height: 9px; border-radius: 50%; background: var(--hoja); border: 1px solid var(--linea-2); }
.linea li.clave::before { background: var(--acento); border-color: var(--acento); box-shadow: 0 0 0 4px var(--hoja), 0 0 0 5px var(--acento-suave); }
.anio { text-align: right; font: 650 .95rem/1.6 var(--f-titulo); color: var(--tinta-3); font-variant-numeric: tabular-nums; }
.linea li.clave .anio { color: var(--acento); }
.linea li.clave > div > b:first-child { font-weight: 700; }
.linea--clave li:not(.clave) { display: none; }
.linea li > div { min-width: 0; }
.linea .chip { white-space: normal; }
@media (max-width: 520px) { .linea::before { left: 4px; top: 12px; } .linea li { grid-template-columns: 1fr; gap: 0; padding: 8px 0 10px 24px; } .linea li::before { left: 0; top: 14px; } .anio { text-align: left; font-size: .9rem; } }

/* Etiquetas */
.chip { display: inline-block; font: 700 .66rem/1.5 var(--f-ui); text-transform: uppercase; letter-spacing: .09em; padding: 3px 8px; border-radius: 3px; white-space: nowrap; vertical-align: 1px; border: 1px solid transparent; }
.chip--pedido { background: var(--verde-suave); color: var(--verde); }
.chip--persona { background: var(--ocre-suave); color: var(--ocre); }
.chip--opcion { color: var(--tinta-3); border-color: var(--linea-2); }
.chip--pro { background: var(--morado-suave); color: var(--morado); }
.chip--aviso { background: var(--acento-suave); color: var(--acento); }
.filtro { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 12px; }
.filtro button { font: 650 .82rem var(--f-ui); background: var(--hoja); color: var(--tinta-2); border: 1px solid var(--linea-2); border-radius: 99px; padding: 6px 12px; cursor: pointer; transition: background .2s, color .2s, border-color .2s; }
.filtro button:hover { border-color: var(--acento); color: var(--acento); }
.filtro button[aria-pressed="true"] { background: var(--tinta); color: var(--papel); border-color: var(--tinta); }
.filtro small { margin-left: 6px; font-size: .78rem; font-variant-numeric: tabular-nums; opacity: .7; }

/* Dónde está: el medidor dice cuánto pesa cada opción */
.opciones { display: grid; gap: 12px; }
.op { border: 1px solid var(--linea); border-radius: 6px; padding: 16px 18px; }
.op h3 { font-size: 1.2rem; margin: 0 0 8px; }
.op ul { margin: 0; padding-left: 20px; }
.op li { margin: 4px 0; }
.nivel { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font: 700 .68rem var(--f-ui); text-transform: uppercase; letter-spacing: .12em; color: var(--tinta-3); }
.nivel::after { content: ""; width: 60px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, currentColor var(--p, 15%), var(--linea) 0); }
.op--1 { border: 1px solid var(--acento); box-shadow: inset 3px 0 0 var(--acento); } .op--1 .nivel { color: var(--acento); --p: 85%; }
.op--2 .nivel { color: var(--ocre); --p: 45%; }
.falta { margin: 10px 0 0; font-size: .95rem; color: var(--tinta-2); }

/* Listas con etiqueta */
.pasos { list-style: none; margin: 0; padding: 0; }
.paso { display: grid; grid-template-columns: 1fr; gap: 6px; padding: 13px 0; border-top: 1px solid var(--linea); }
.paso:first-child { border-top: 0; }
.paso[hidden] { display: none; }
.paso .chip { justify-self: start; }
@media (min-width: 640px) { .paso { grid-template-columns: 140px 1fr; gap: 14px; } .paso .chip { margin-top: 4px; } }

/* Tabla del Registro */
.tabla { width: 100%; border-collapse: collapse; font-size: .97rem; font-variant-numeric: tabular-nums; }
.tabla th, .tabla td { text-align: left; vertical-align: top; padding: 10px 8px; border-top: 1px solid var(--linea); }
.tabla th { width: 86px; padding-left: 0; color: var(--tinta-3); font: 700 .68rem/2.1 var(--f-ui); text-transform: uppercase; letter-spacing: .12em; }
.tabla tr:first-child th, .tabla tr:first-child td { border-top: 0; }

/* Documentos */
.docs { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 640px) { .docs { grid-template-columns: 1fr 1fr; } }
.doc { position: relative; display: flex; flex-direction: column; gap: 2px; min-height: 82px; padding: 13px 16px 14px 84px; text-align: left; font: inherit; color: inherit; background: var(--papel); border: 1px solid var(--linea); border-radius: 6px; cursor: pointer; transition: border-color .2s, background .2s; }
.doc:hover { border-color: var(--acento); background: var(--hoja); }
.doc b { font: 650 1rem/1.35 var(--f-titulo); }
.doc span:last-child { color: var(--tinta-3); font-size: .92rem; }
.doc__a { position: absolute; left: 16px; top: 15px; width: 56px; font: 700 .98rem/1.2 var(--f-titulo); color: var(--acento); font-variant-numeric: tabular-nums; }

details { border-top: 1px solid var(--linea); padding-top: 12px; }
details summary { display: flex; align-items: center; gap: 10px; cursor: pointer; list-style: none; font: 650 .95rem var(--f-ui); color: var(--acento); }
details summary::-webkit-details-marker { display: none; }
details summary::before { content: "+"; display: inline-grid; place-items: center; width: 22px; height: 22px; border: 1px solid currentColor; border-radius: 50%; font-size: .95rem; line-height: 1; transition: transform .2s; }
details[open] summary::before { transform: rotate(45deg); }
details ul { padding-left: 20px; }
.pie { color: var(--tinta-3); font-size: .85rem; text-align: center; padding: 18px 0 40px; }

/* Visor de documentos */
.visor { border: 0; padding: 0; margin: 0; width: 100vw; height: 100vh; height: 100dvh; max-width: none; max-height: none; background: #0f0d0b; color: #f0eae0; }
.visor::backdrop { background: rgba(0, 0, 0, .8); }
.visor[open] { display: flex; flex-direction: column; }
.visor__barra { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 6px; padding: 10px 12px; background: #0f0d0b; border-bottom: 1px solid #2a251f; }
.visor__t { order: 9; flex: 1 1 100%; min-width: 0; font: 650 .88rem/1.35 var(--f-ui); }
.visor__barra [data-tam] { margin-left: auto; }
@media (min-width: 700px) { .visor__t { order: 0; flex-basis: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .visor__barra [data-tam] { margin-left: 0; } }
.visor__barra button { flex: none; font: 650 .88rem var(--f-ui); background: #f0eae0; color: #1e1a15; border: 0; border-radius: 99px; padding: 8px 13px; cursor: pointer; }
.visor__barra button[data-ant], .visor__barra button[data-sig] { width: 38px; padding: 8px 0; font-size: 1.1rem; line-height: 1; }
.visor__caja { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
.visor__caja img { display: block; width: 100%; height: auto; }
.visor__caja.real img { width: auto; max-width: none; }
.cargando { color: var(--tinta-3); padding: 40px 0; text-align: center; }

/* Mapa interactivo (26-oct): se arma solo si el contenido trae un [data-mapa-vivo] y sus figuras en GeoJSON */
.mapa-botones { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 10px; }
.mapa-botones .ver { margin-top: 0; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
@media (max-width: 520px) { .mapa-botones { display: grid; grid-template-columns: 1fr 1fr; } .mapa-botones .ver { padding: 9px 8px; font-size: .84rem; } }
.mapa-vivo { height: min(60vh, 520px); border-radius: 6px; border: 1px solid var(--linea-2); background: #d9d4ca; z-index: 0; overflow: hidden; }
.mapa-vivo.grande { position: fixed; inset: 0; height: 100dvh; width: 100vw; border-radius: 0; border: 0; z-index: 20; }
.mapa-cerrar { display: none; }
.mapa-vivo.grande ~ .mapa-cerrar { display: block; position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 21; font: 650 .92rem var(--f-ui); background: #fffdf9; color: #1e1a15; border: 1px solid #cdc2b1; border-radius: 99px; padding: 9px 16px; cursor: pointer; box-shadow: 0 2px 12px rgba(0, 0, 0, .3); }
.mapa-msg { margin: 8px 0 0; font-size: .95rem; color: var(--tinta-2); min-height: 1.4em; }
.mapa-ley { list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .9rem; color: var(--tinta-2); }
.mapa-ley label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; padding: 5px 0; }
.mapa-ley input { width: 18px; height: 18px; accent-color: var(--acento); margin: 0; }
.mapa-ley i { display: inline-block; width: 22px; height: 0; border-top: 3px solid; }
.mapa-ley i.area { height: 12px; border: 2px dashed; border-radius: 2px; background: color-mix(in srgb, currentColor 25%, transparent); }
.mapa-ley i.guiones { border-top-style: dashed; }
.mapa-ley i.pto { width: 12px; height: 12px; border: 2px solid #fff; border-radius: 50%; background: #3e2723; box-shadow: 0 0 0 1px #3e2723; }
.recorrido { list-style: none; margin: 14px 0 0; padding: 0; }
.recorrido > li { display: none; padding: 13px 16px; background: var(--papel); border-left: 3px solid var(--acento); border-radius: 4px; }
.recorrido > li.activo { display: block; animation: entra .25s ease-out; }
.recorrido > li b:first-child { font-weight: 700; }
@keyframes entra { from { opacity: 0; } to { opacity: 1; } }
.rec-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
.rec-nav + .recorrido { margin-top: 10px; }
.rec-nav > button { font: 650 .9rem var(--f-ui); background: var(--acento); color: var(--sobre-acento); border: 0; border-radius: 6px; padding: 9px 16px; cursor: pointer; transition: background .2s, opacity .2s; }
.rec-nav > button:hover { background: var(--acento-hondo); }
.rec-nav > button:disabled { opacity: .35; cursor: default; }
.rec-nav span { font: 650 .82rem var(--f-ui); color: var(--tinta-3); font-variant-numeric: tabular-nums; }
.leaflet-tooltip.etq { font: 650 .85rem var(--f-titulo); color: #1e1a15; background: rgba(255, 253, 249, .94); border: 0; box-shadow: 0 1px 6px rgba(0, 0, 0, .25); }
.leaflet-tooltip.medida { font: 650 .72rem var(--f-ui); color: #fff; background: rgba(20, 17, 13, .82); border: 0; border-radius: 4px; padding: 3px 7px; box-shadow: none; white-space: nowrap; }
.leaflet-tooltip.medida::before { display: none; }
.leaflet-container { font-family: var(--f-texto); }

/* Impresión: el informe en papel, sin controles; el mapa del catastro reemplaza al interactivo */
@media print {
  @page { margin: 16mm 14mm; }
  :root { --papel: #fff; --hoja: #fff; --tinta: #000; --tinta-2: #222; --tinta-3: #444; --linea: #ccc; --linea-2: #999; --acento: #7c2015; --acento-suave: #f3e3df; }
  body { background: #fff; font-size: 10.5pt; }
  main { max-width: none; padding: 0; }
  .indice, .salir, .progreso, .cab__acciones, .mapa-botones, .mapa-vivo, .mapa-cerrar, .mapa-ley, .mapa-msg, .rec-nav, .ver, .filtro, [data-clave], .solo-pantalla { display: none !important; }
  .recorrido > li { display: block !important; margin-top: 6pt; break-inside: avoid; }
  .bloque { box-shadow: none; border: 0; border-top: 1px solid #999; border-radius: 0; padding: 14pt 0 0; margin: 0 0 14pt; }
  .linea--clave li:not(.clave) { display: grid; }
  .paso[hidden] { display: grid; }
  .linea li, .paso, .op, .doc, .ficha, .fig, tr { break-inside: avoid; }
  h2, h3 { break-after: avoid; }
  .doc { min-height: 0; }
  a { color: inherit; text-decoration: none; }
}
</style>
</head>
<body>
<main id="app"><p class="cargando">Cargando…</p></main>
<script type="module">
const LLAVE = 'inv3574-llave';
const b64 = (u8) => btoa(String.fromCharCode(...u8));
const deB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const app = document.getElementById('app');
let acceso = null;
const leerAcceso = async () => (acceso ||= await (await fetch('acceso.json', { cache: 'no-cache' })).json());
const importar = (bruta) => crypto.subtle.importKey('raw', bruta, 'AES-GCM', false, ['decrypt']);
const descifrar = async (llave, datos) => { const u8 = new Uint8Array(datos); return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8.slice(0, 12) }, llave, u8.slice(12)); };
async function probar(llave) {
  const a = await leerAcceso();
  try { return new TextDecoder().decode(await descifrar(llave, deB64(a.prueba))) === 'inv3574'; } catch { return false; }
}
async function derivar(clave) {
  const a = await leerAcceso();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: deB64(a.sal), iterations: a.vueltas }, base, 256));
}
const guardar = (b) => { try { localStorage.setItem(LLAVE, b64(b)); } catch { /* sin almacenamiento */ } };
const guardada = () => { try { const s = localStorage.getItem(LLAVE); return s ? deB64(s) : null; } catch { return null; } };

function pedir() {
  return new Promise((resolver) => {
    app.innerHTML = `<section class="puerta"><div class="puerta__c">
      <p class="puerta__m">Documento privado</p><h1>Acceso privado</h1><p>Escriba la contraseña que le pasaron.</p>
      <form autocomplete="off"><label for="clave">Contraseña</label>
      <input id="clave" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button><p class="puerta__e" role="alert" hidden></p></form></div></section>`;
    const f = app.querySelector('form'), c = app.querySelector('input'), e = app.querySelector('.puerta__e'), b = app.querySelector('button');
    c.focus();
    f.addEventListener('submit', async (ev) => {
      ev.preventDefault(); b.disabled = true; b.textContent = 'Abriendo…'; e.hidden = true;
      try {
        const bruta = await derivar(c.value); const llave = await importar(bruta);
        if (await probar(llave)) { guardar(bruta); resolver(llave); return; }
        e.textContent = 'Esa no es la contraseña.';
      } catch { e.textContent = 'No se pudo comprobar. Revise la conexión y vuelva a intentarlo.'; }
      e.hidden = false; b.disabled = false; b.textContent = 'Entrar'; c.select();
    });
  });
}

async function abrir() {
  let llave = null;
  const g = guardada();
  if (g) { const k = await importar(g); if (await probar(k)) llave = k; }
  if (!llave) llave = await pedir();
  app.innerHTML = '<p class="cargando">Abriendo…</p>';
  const cifrado = await (await fetch('datos/c.dat', { cache: 'no-cache' })).arrayBuffer();
  const plano = await descifrar(llave, cifrado);
  const texto = await new Response(new Blob([plano]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  const { html, imgs } = JSON.parse(texto);
  app.innerHTML = html;
  const cache = new Map();
  const url = (alias) => {
    if (!cache.has(alias)) cache.set(alias, (async () => {
      const i = imgs[alias];
      const d = await descifrar(llave, await (await fetch('datos/' + i.archivo)).arrayBuffer());
      return URL.createObjectURL(new Blob([d], { type: i.tipo }));
    })());
    return cache.get(alias);
  };
  const ver = new IntersectionObserver((es) => es.forEach(async (en) => {
    if (!en.isIntersecting) return; ver.unobserve(en.target);
    try { en.target.src = await url(en.target.dataset.img); } catch { en.target.alt = 'No se pudo abrir la imagen.'; }
  }), { rootMargin: '300px' });
  app.querySelectorAll('img[data-img]').forEach((im) => ver.observe(im));

  const visor = document.createElement('dialog');
  visor.className = 'visor';
  visor.innerHTML = `<div class="visor__barra"><button type="button" data-ant aria-label="Anterior">‹</button><span class="visor__t" aria-live="polite"></span><button type="button" data-sig aria-label="Siguiente">›</button><button type="button" data-tam>Tamaño real</button><button type="button" data-cerrar>Cerrar</button></div><div class="visor__caja"><img alt=""></div>`;
  document.body.append(visor);
  const vimg = visor.querySelector('img'), caja = visor.querySelector('.visor__caja'), titulo = visor.querySelector('.visor__t');
  const tam = visor.querySelector('[data-tam]'), ant = visor.querySelector('[data-ant]'), sig = visor.querySelector('[data-sig]');
  let grupo = [], pos = 0;
  const nombre = (b) => (b.dataset.titulo || b.querySelector('b')?.textContent || b.closest('figure')?.querySelector('img')?.alt || b.textContent).trim();
  const mostrar = async (k) => {
    pos = (k + grupo.length) % grupo.length;
    const b = grupo[pos];
    caja.classList.remove('real'); tam.textContent = 'Tamaño real'; caja.scrollTo(0, 0);
    titulo.textContent = grupo.length > 1 ? `${pos + 1}/${grupo.length} · ${nombre(b)}` : nombre(b);
    vimg.removeAttribute('src'); vimg.alt = nombre(b);
    try { const u = await url(b.dataset.abrir); if (grupo[pos] === b) vimg.src = u; } catch { vimg.alt = 'No se pudo abrir la imagen.'; }
  };
  visor.querySelector('[data-cerrar]').addEventListener('click', () => visor.close());
  tam.addEventListener('click', () => { caja.classList.toggle('real'); tam.textContent = caja.classList.contains('real') ? 'Ajustar' : 'Tamaño real'; });
  ant.addEventListener('click', () => mostrar(pos - 1));
  sig.addEventListener('click', () => mostrar(pos + 1));
  visor.addEventListener('keydown', (e) => { if (grupo.length < 2) return; if (e.key === 'ArrowLeft') mostrar(pos - 1); if (e.key === 'ArrowRight') mostrar(pos + 1); });
  let x0 = null;
  caja.addEventListener('touchstart', (e) => { x0 = e.touches.length === 1 && !caja.classList.contains('real') ? e.touches[0].clientX : null; }, { passive: true });
  caja.addEventListener('touchend', (e) => { if (x0 === null || grupo.length < 2) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 70) mostrar(pos + (dx < 0 ? 1 : -1)); x0 = null; });
  app.addEventListener('click', (e) => {
    const b = e.target.closest('[data-abrir]'); if (!b) return;
    const c = b.closest('.docs');
    grupo = c ? [...c.querySelectorAll('[data-abrir]')] : [b];
    ant.hidden = sig.hidden = grupo.length < 2;
    visor.showModal(); mostrar(grupo.indexOf(b));
  });
  const salir = document.createElement('button');
  salir.className = 'salir'; salir.type = 'button'; salir.textContent = 'Salir';
  salir.addEventListener('click', () => { try { localStorage.removeItem(LLAVE); } catch { /* nada */ } location.reload(); });
  document.body.append(salir);
  const geo = app.querySelector('script[type="application/geo+json"]'), cajaMapa = app.querySelector('[data-mapa-vivo]');
  if (geo && cajaMapa) montarMapa(cajaMapa, JSON.parse(geo.textContent)).catch(() => { cajaMapa.textContent = 'No se pudo cargar el mapa. Revise la conexión.'; });
  mejorar(url);
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
}

// Lo que ayuda a leer: el índice marca la sección que está en pantalla, una barra fina dice cuánto falta, las listas
// con etiquetas se filtran por etiqueta, la historia se puede ver solo con los hechos clave y el botón de imprimir
// abre las secciones plegadas y carga todas las imágenes antes de pedir la impresión.
function mejorar(url) {
  const nav = app.querySelector('.indice');
  const enlaces = new Map([...(nav?.querySelectorAll('a[href^="#"]') || [])].map((a) => [a.getAttribute('href').slice(1), a]));
  const enPantalla = new Set();
  let actual = null;
  const espia = new IntersectionObserver((es) => {
    es.forEach((e) => (e.isIntersecting ? enPantalla.add(e.target.id) : enPantalla.delete(e.target.id)));
    const id = [...enlaces.keys()].find((k) => enPantalla.has(k)) || null;
    if (id === actual) return;
    actual = id;
    enlaces.forEach((a, k) => (k === id ? a.setAttribute('aria-current', 'true') : a.removeAttribute('aria-current')));
    const a = enlaces.get(id);
    if (a) nav.scrollTo({ left: a.offsetLeft - (nav.clientWidth - a.offsetWidth) / 2, behavior: quieto ? 'auto' : 'smooth' });
  }, { rootMargin: '-30% 0px -65% 0px' });
  enlaces.forEach((_, k) => { const sec = document.getElementById(k); if (sec) espia.observe(sec); });

  const barra = document.createElement('div');
  barra.className = 'progreso'; barra.setAttribute('aria-hidden', 'true'); document.body.append(barra);
  let pedido = false;
  const avance = () => { pedido = false; const h = document.documentElement; barra.style.transform = `scaleX(${Math.min(1, h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight))})`; };
  addEventListener('scroll', () => { if (!pedido) { pedido = true; requestAnimationFrame(avance); } }, { passive: true });
  avance();

  app.querySelectorAll('ul.pasos').forEach((ul) => {
    const filas = [...ul.children].filter((li) => li.querySelector('.chip'));
    const etiqueta = (li) => li.querySelector('.chip').textContent.trim();
    const cuenta = new Map();
    filas.forEach((li) => cuenta.set(etiqueta(li), (cuenta.get(etiqueta(li)) || 0) + 1));
    if (filas.length < 6 || cuenta.size < 2) return;
    const f = document.createElement('div');
    f.className = 'filtro'; f.setAttribute('role', 'group'); f.setAttribute('aria-label', 'Filtrar por etiqueta');
    const boton = (t, n) => { const b = document.createElement('button'); b.type = 'button'; b.dataset.t = t; b.setAttribute('aria-pressed', String(!t)); b.append(t || 'Todo'); const c = document.createElement('small'); c.textContent = n; b.append(c); return b; };
    f.append(boton('', filas.length), ...[...cuenta].map(([t, n]) => boton(t, n)));
    f.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      f.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      filas.forEach((li) => { li.hidden = !!b.dataset.t && etiqueta(li) !== b.dataset.t; });
    });
    ul.before(f);
  });

  app.querySelectorAll('ol.linea').forEach((ol) => {
    const n = ol.querySelectorAll(':scope > li.clave').length;
    if (!n) return;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'ver'; b.dataset.clave = '';
    const poner = (solo) => { ol.classList.toggle('linea--clave', solo); b.textContent = solo ? `Ver toda la historia (${ol.children.length})` : `Ver solo los hechos clave (${n})`; };
    b.addEventListener('click', () => poner(!ol.classList.contains('linea--clave')));
    poner(false); ol.before(b);
  });

  const abrirTodo = () => Promise.all([...app.querySelectorAll('img[data-img]')].map(async (im) => {
    try { if (!im.getAttribute('src')) im.src = await url(im.dataset.img); await im.decode(); } catch { /* sigue sin esa imagen */ }
  }));
  addEventListener('beforeprint', () => { app.querySelectorAll('details').forEach((d) => { d.open = true; }); abrirTodo(); });
  app.querySelectorAll('[data-imprimir]').forEach((b) => b.addEventListener('click', async () => {
    const t = b.textContent; b.disabled = true; b.textContent = 'Preparando…';
    app.querySelectorAll('details').forEach((d) => { d.open = true; });
    await abrirTodo();
    b.disabled = false; b.textContent = t; print();
  }));
}

// Mapa interactivo: Leaflet 1.9.4 (cdnjs) con fondo satelital o de calles de Esri; se carga cuando el mapa entra en
// pantalla. Las figuras, las capas y los pasos del recorrido vienen del contenido cifrado; aquí no hay datos.
// «Dónde estoy» usa la ubicación del teléfono solo en esta página; no se envía a ningún lado.
const cargar = (tag, attrs) => new Promise((ok, mal) => { const e = document.createElement(tag); Object.assign(e, attrs); e.onload = ok; e.onerror = mal; document.head.append(e); });
const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
async function montarMapa(caja, datos) {
  await new Promise((ok) => { const o = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) { o.disconnect(); ok(); } }, { rootMargin: '300px' }); o.observe(caja); });
  const V = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/';
  await cargar('link', { rel: 'stylesheet', href: V + 'leaflet.min.css', crossOrigin: 'anonymous' });
  await cargar('script', { src: V + 'leaflet.min.js', crossOrigin: 'anonymous' });
  const L = window.L, raiz = caja.closest('section') || app, msg = raiz.querySelector('[data-mapa-msg]');
  const avisar = (t) => { if (msg) msg.textContent = t; };
  const esri = (s) => `https://server.arcgisonline.com/ArcGIS/rest/services/${s}/MapServer/tile/{z}/{y}/{x}`;
  const atr = 'Imágenes y calles © Esri y sus fuentes';
  const sat = L.layerGroup([L.tileLayer(esri('World_Imagery'), { maxZoom: 19, attribution: atr }),
    L.tileLayer(esri('Reference/World_Transportation'), { maxZoom: 19, opacity: 0.8 }), L.tileLayer(esri('Reference/World_Boundaries_and_Places'), { maxZoom: 19 })]);
  const calles = L.tileLayer(esri('World_Street_Map'), { maxZoom: 19, attribution: atr });
  const mapa = L.map(caja, { layers: [sat], scrollWheelZoom: false, zoomSnap: 0.25 });
  L.control.layers({ 'Satélite': sat, 'Calles': calles }, null, { position: 'topright' }).addTo(mapa);
  L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(mapa);

  // Una capa de Leaflet por cada «capa» del GeoJSON; las medidas solo se ven de cerca.
  const capas = {}, medidas = L.layerGroup();
  let finca = null;
  for (const f of datos.features) {
    const p = f.properties, g = (capas[p.capa] ||= L.featureGroup());
    if (p.tipo === 'medida') {
      L.tooltip({ permanent: true, direction: p.dir || 'center', className: 'medida', offset: [0, 0] })
        .setLatLng([f.geometry.coordinates[1], f.geometry.coordinates[0]]).setContent(p.nombre).addTo(medidas);
      continue;
    }
    L.geoJSON(f, {
      style: () => (p.tipo === 'finca'
        ? { color: p.color, weight: 3, fillColor: p.color, fillOpacity: 0.3, dashArray: '9 6' }
        : { color: p.color, weight: 4, opacity: 0.95, dashArray: p.guiones ? '8 7' : null }),
      pointToLayer: (_, ll) => L.circleMarker(ll, { radius: 7, color: '#fff', weight: 2, fillColor: '#3e2723', fillOpacity: 1 }),
      onEachFeature: (_, l) => {
        l.bindPopup(p.nombre);
        if (p.tipo === 'finca') { finca = l; l.bindTooltip(p.nombre, { permanent: true, direction: 'center', className: 'etq' }); }
      },
    }).addTo(g);
  }
  // De cerca se ven las medidas de cada lado y el nombre de la finca se esconde para no taparlas.
  const verMedidas = () => {
    const z = mapa.getZoom() >= 16.25 && mapa.hasLayer(capas.finca);
    if (z && !mapa.hasLayer(medidas)) { medidas.addTo(mapa); finca?.closeTooltip(); }
    if (!z && mapa.hasLayer(medidas)) { medidas.remove(); if (mapa.hasLayer(capas.finca)) finca?.openTooltip(); }
  };
  mapa.on('zoomend', verMedidas);
  const casillas = [...raiz.querySelectorAll('[data-mapa-ley] input[data-capa]')];
  const mostrar = (lista) => {
    for (const [k, g] of Object.entries(capas)) { const si = lista.includes(k); if (si && !mapa.hasLayer(g)) g.addTo(mapa); if (!si && mapa.hasLayer(g)) g.remove(); }
    casillas.forEach((c) => { c.checked = lista.includes(c.dataset.capa); });
    verMedidas();
  };
  casillas.forEach((c) => c.addEventListener('change', () => mostrar(casillas.filter((x) => x.checked).map((x) => x.dataset.capa))));
  const ir = (lista) => {
    const b = L.latLngBounds([]);
    lista.forEach((k) => capas[k] && k !== 'ref' && b.extend(capas[k].getBounds()));
    if (!b.isValid()) return;
    const opc = { padding: [lista.includes('finca') ? Math.min(96, caja.clientWidth * 0.22) : 20, 28], maxZoom: 17 }; // de lado caben las medidas
    quieto ? mapa.fitBounds(b, opc) : mapa.flyToBounds(b, { ...opc, duration: 1.1 });
  };

  // Recorrido: cada paso del contenido dice qué capas encender.
  const pasos = [...raiz.querySelectorAll('[data-recorrido] > li')];
  if (pasos.length) {
    const nav = document.createElement('div'); nav.className = 'rec-nav';
    nav.innerHTML = '<button type="button" data-ant>Anterior</button><span aria-live="polite"></span><button type="button" data-sig>Siguiente</button>';
    raiz.querySelector('[data-recorrido]').before(nav);
    const cont = nav.querySelector('span');
    let actual = 0;
    const paso = (k) => {
      actual = Math.max(0, Math.min(pasos.length - 1, k));
      pasos.forEach((li, n) => li.classList.toggle('activo', n === actual));
      cont.textContent = `${actual + 1} de ${pasos.length}`;
      nav.querySelector('[data-ant]').disabled = actual === 0; nav.querySelector('[data-sig]').disabled = actual === pasos.length - 1;
      const lista = pasos[actual].dataset.capas.split(',');
      mostrar(lista); ir((pasos[actual].dataset.ir || pasos[actual].dataset.capas).split(','));
    };
    nav.querySelector('[data-ant]').addEventListener('click', () => paso(actual - 1));
    nav.querySelector('[data-sig]').addEventListener('click', () => paso(actual + 1));
    mapa.fitBounds(finca.getBounds().pad(1.2));
    paso(0);
  } else { mostrar(Object.keys(capas)); mapa.fitBounds(finca ? finca.getBounds().pad(0.9) : L.featureGroup(Object.values(capas)).getBounds()); }

  // Pantalla completa.
  const cerrar = document.createElement('button'); cerrar.type = 'button'; cerrar.className = 'mapa-cerrar'; cerrar.textContent = 'Cerrar pantalla completa';
  caja.after(cerrar);
  const grande = (si) => { caja.classList.toggle('grande', si); mapa.scrollWheelZoom[si ? 'enable' : 'disable'](); setTimeout(() => mapa.invalidateSize(), 80); };
  cerrar.addEventListener('click', () => grande(false));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && caja.classList.contains('grande')) grande(false); });
  raiz.querySelector('[data-mapa-grande]')?.addEventListener('click', () => grande(true));

  // Dónde estoy: punto azul con su margen de error y distancia al borde de la finca.
  let yo = null;
  raiz.querySelector('[data-mapa-yo]')?.addEventListener('click', () => {
    if (!navigator.geolocation) { avisar('Este teléfono no da la ubicación.'); return; }
    avisar('Buscando su ubicación…');
    navigator.geolocation.getCurrentPosition((pos) => {
      const ll = L.latLng(pos.coords.latitude, pos.coords.longitude);
      yo?.remove();
      yo = L.layerGroup([L.circle(ll, { radius: pos.coords.accuracy, color: '#1a73e8', weight: 1, fillOpacity: 0.12 }),
        L.circleMarker(ll, { radius: 8, color: '#fff', weight: 3, fillColor: '#1a73e8', fillOpacity: 1 }).bindPopup('Usted está aquí')]).addTo(mapa);
      if (!finca) return;
      const a = finca.getLatLngs()[0];
      let dentro = false;
      for (let i = 0, j = a.length - 1; i < a.length; j = i++) if ((a[i].lat > ll.lat) !== (a[j].lat > ll.lat) && ll.lng < (a[j].lng - a[i].lng) * (ll.lat - a[i].lat) / (a[j].lat - a[i].lat) + a[i].lng) dentro = !dentro;
      // distancia al borde: al segmento más cercano, en metros (aproximación plana; sobra a esta escala)
      const P = mapa.options.crs.project.bind(mapa.options.crs), q = P(ll);
      const seg = (u, v) => { const A = P(u), B = P(v), dx = B.x - A.x, dy = B.y - A.y, t = Math.max(0, Math.min(1, ((q.x - A.x) * dx + (q.y - A.y) * dy) / (dx * dx + dy * dy || 1))); return Math.hypot(q.x - A.x - t * dx, q.y - A.y - t * dy); };
      const m = Math.min(...a.map((u, k) => seg(u, a[(k + 1) % a.length]))) * Math.cos(ll.lat * Math.PI / 180);
      avisar(dentro ? `Usted está dentro de la zona donde probablemente está la finca (precisión del teléfono: ±${Math.round(pos.coords.accuracy)} m).` : `Usted está a unos ${Math.round(m)} m del borde de la zona probable de la finca (precisión del teléfono: ±${Math.round(pos.coords.accuracy)} m).`);
      const b = L.latLngBounds([ll]).extend(finca.getBounds());
      quieto ? mapa.fitBounds(b.pad(0.25)) : mapa.flyToBounds(b.pad(0.25), { duration: 1 });
    }, () => avisar('No se pudo leer la ubicación. Revise que el teléfono le dé permiso a esta página.'), { enableHighAccuracy: true, timeout: 15000 });
  });

  // Bajar para Google Earth: KML hecho aquí mismo con las figuras del mapa.
  raiz.querySelector('[data-mapa-kml]')?.addEventListener('click', (e) => {
    const esc = (t) => String(t).replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
    const kc = (hex, a) => a + hex.slice(5, 7) + hex.slice(3, 5) + hex.slice(1, 3);
    const co = (c) => c.map(([x, y]) => `${x},${y},0`).join(' ');
    const pm = datos.features.filter((f) => f.properties.tipo !== 'medida').map((f, k) => {
      const p = f.properties, g = f.geometry, col = p.color || '#3e2723';
      const geo = g.type === 'Polygon' ? `<Polygon><outerBoundaryIs><LinearRing><coordinates>${co(g.coordinates[0])}</coordinates></LinearRing></outerBoundaryIs></Polygon>`
        : g.type === 'LineString' ? `<LineString><tessellate>1</tessellate><coordinates>${co(g.coordinates)}</coordinates></LineString>` : `<Point><coordinates>${co([g.coordinates])}</coordinates></Point>`;
      return `<Placemark><name>${esc(p.nombre)}</name><Style><LineStyle><color>${kc(col, 'ff')}</color><width>3</width></LineStyle><PolyStyle><color>${kc(col, '55')}</color></PolyStyle></Style>${geo}</Placemark>`;
    }).join('');
    const kml = `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${esc(e.currentTarget.dataset.titulo || 'Mapa')}</name>${pm}</Document></kml>`;
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' }));
    a.download = e.currentTarget.dataset.nombre || 'mapa.kml'; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  });
}
abrir().catch(() => { app.innerHTML = '<p class="cargando">No se pudo abrir la página. Recargue para intentarlo otra vez.</p>'; });
</script>
