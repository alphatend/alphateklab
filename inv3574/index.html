<main id="app"><p class="cargando">Cargando…</p></main>
<script type="module">
const LLAVE = 'inv3574-llave';
const b64 = (u8) => btoa(String.fromCharCode(...u8));
const deB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const app = document.getElementById('app');
let acceso = null;
const leerAcceso = async () => (acceso ||= await (await fetch('acceso.json', { cache: 'no-cache' })).json());
const importar = (bruta) => crypto.subtle.importKey('raw', bruta, 'AES-GCM', false, ['decrypt']);
const descifrar = async (llave, datos) => { const u8 = new Uint8Array(datos); return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8.slice(0, 12) }, llave, u8.slice(12)); };
async function probar(llave) {
  const a = await leerAcceso();
  try { return new TextDecoder().decode(await descifrar(llave, deB64(a.prueba))) === 'inv3574'; } catch { return false; }
}
async function derivar(clave) {
  const a = await leerAcceso();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: deB64(a.sal), iterations: a.vueltas }, base, 256));
}
const guardar = (b) => { try { localStorage.setItem(LLAVE, b64(b)); } catch { /* sin almacenamiento */ } };
const guardada = () => { try { const s = localStorage.getItem(LLAVE); return s ? deB64(s) : null; } catch { return null; } };

function pedir() {
  return new Promise((resolver) => {
    app.innerHTML = `<section class="puerta"><div class="puerta__c">
      <h1>Acceso privado</h1><p>Escriba la contraseña que le pasaron.</p>
      <form autocomplete="off"><label for="clave">Contraseña</label>
      <input id="clave" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button><p class="puerta__e" role="alert" hidden></p></form></div></section>`;
    const f = app.querySelector('form'), c = app.querySelector('input'), e = app.querySelector('.puerta__e'), b = app.querySelector('button');
    c.focus();
    f.addEventListener('submit', async (ev) => {
      ev.preventDefault(); b.disabled = true; b.textContent = 'Abriendo…'; e.hidden = true;
      try {
        const bruta = await derivar(c.value); const llave = await importar(bruta);
        if (await probar(llave)) { guardar(bruta); resolver(llave); return; }
        e.textContent = 'Esa no es la contraseña.';
      } catch { e.textContent = 'No se pudo comprobar. Revise la conexión y vuelva a intentarlo.'; }
      e.hidden = false; b.disabled = false; b.textContent = 'Entrar'; c.select();
    });
  });
}

async function abrir() {
  let llave = null;
  const g = guardada();
  if (g) { const k = await importar(g); if (await probar(k)) llave = k; }
  if (!llave) llave = await pedir();
  app.innerHTML = '<p class="cargando">Abriendo…</p>';
  const cifrado = await (await fetch('datos/c.dat', { cache: 'no-cache' })).arrayBuffer();
  const plano = await descifrar(llave, cifrado);
  const texto = await new Response(new Blob([plano]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  const { html, imgs } = JSON.parse(texto);
  app.innerHTML = html;
  const cache = new Map();
  const url = (alias) => {
    if (!cache.has(alias)) cache.set(alias, (async () => {
      const i = imgs[alias];
      const d = await descifrar(llave, await (await fetch('datos/' + i.archivo)).arrayBuffer());
      return URL.createObjectURL(new Blob([d], { type: i.tipo }));
    })());
    return cache.get(alias);
  };
  const ver = new IntersectionObserver((es) => es.forEach(async (en) => {
    if (!en.isIntersecting) return; ver.unobserve(en.target);
    try { en.target.src = await url(en.target.dataset.img); } catch { en.target.alt = 'No se pudo abrir la imagen.'; }
  }), { rootMargin: '300px' });
  app.querySelectorAll('img[data-img]').forEach((im) => ver.observe(im));

  const visor = document.createElement('dialog');
  visor.className = 'visor';
  visor.innerHTML = `<div class="visor__barra"><button type="button" data-ant aria-label="Anterior">‹</button><span class="visor__t" aria-live="polite"></span><button type="button" data-sig aria-label="Siguiente">›</button><button type="button" data-tam>Tamaño real</button><button type="button" data-cerrar>Cerrar</button></div><div class="visor__caja"><img alt=""></div>`;
  document.body.append(visor);
  const vimg = visor.querySelector('img'), caja = visor.querySelector('.visor__caja'), titulo = visor.querySelector('.visor__t');
  const tam = visor.querySelector('[data-tam]'), ant = visor.querySelector('[data-ant]'), sig = visor.querySelector('[data-sig]');
  let grupo = [], pos = 0;
  const nombre = (b) => (b.dataset.titulo || b.querySelector('b')?.textContent || b.closest('figure')?.querySelector('img')?.alt || b.textContent).trim();
  const mostrar = async (k) => {
    pos = (k + grupo.length) % grupo.length;
    const b = grupo[pos];
    caja.classList.remove('real'); tam.textContent = 'Tamaño real'; caja.scrollTo(0, 0);
    titulo.textContent = grupo.length > 1 ? `${nombre(b)} (${pos + 1} de ${grupo.length})` : nombre(b);
    vimg.removeAttribute('src'); vimg.alt = nombre(b);
    try { const u = await url(b.dataset.abrir); if (grupo[pos] === b) vimg.src = u; } catch { vimg.alt = 'No se pudo abrir la imagen.'; }
  };
  visor.querySelector('[data-cerrar]').addEventListener('click', () => visor.close());
  tam.addEventListener('click', () => { caja.classList.toggle('real'); tam.textContent = caja.classList.contains('real') ? 'Ajustar' : 'Tamaño real'; });
  ant.addEventListener('click', () => mostrar(pos - 1));
  sig.addEventListener('click', () => mostrar(pos + 1));
  visor.addEventListener('keydown', (e) => { if (grupo.length < 2) return; if (e.key === 'ArrowLeft') mostrar(pos - 1); if (e.key === 'ArrowRight') mostrar(pos + 1); });
  let x0 = null;
  caja.addEventListener('touchstart', (e) => { x0 = e.touches.length === 1 && !caja.classList.contains('real') ? e.touches[0].clientX : null; }, { passive: true });
  caja.addEventListener('touchend', (e) => { if (x0 === null || grupo.length < 2) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 70) mostrar(pos + (dx < 0 ? 1 : -1)); x0 = null; });
  app.addEventListener('click', (e) => {
    const b = e.target.closest('[data-abrir]'); if (!b) return;
    const c = b.closest('.docs');
    grupo = c ? [...c.querySelectorAll('[data-abrir]')] : [b];
    ant.hidden = sig.hidden = grupo.length < 2;
    visor.showModal(); mostrar(grupo.indexOf(b));
  });
  const salir = document.createElement('button');
  salir.type = 'button'; salir.textContent = 'Cerrar sesión en este equipo';
  salir.addEventListener('click', () => { try { localStorage.removeItem(LLAVE); } catch { /* nada */ } location.reload(); });
  (app.querySelector('.pie-acciones') || app).append(salir);
  const geo = app.querySelector('script[type="application/geo+json"]'), cajaMapa = app.querySelector('[data-mapa-vivo]');
  if (geo && cajaMapa) montarMapa(cajaMapa, JSON.parse(geo.textContent)).catch(() => { cajaMapa.textContent = 'No se pudo cargar el mapa. Revise la conexión.'; });
  mejorar(url);
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
}

// Lo que ayuda a leer: el índice marca la sección que está en pantalla, y el botón de imprimir abre lo plegado y carga
// todas las imágenes antes de pedir la impresión.
function mejorar(url) {
  const nav = app.querySelector('.indice'), carril = nav?.querySelector('.indice-c') || nav;
  const enlaces = new Map([...(nav?.querySelectorAll('a[href^="#"]') || [])].map((a) => [a.getAttribute('href').slice(1), a]));
  const enPantalla = new Set();
  let actual = null;
  const espia = new IntersectionObserver((es) => {
    es.forEach((e) => (e.isIntersecting ? enPantalla.add(e.target.id) : enPantalla.delete(e.target.id)));
    const id = [...enlaces.keys()].find((k) => enPantalla.has(k)) || null;
    if (id === actual) return;
    actual = id;
    enlaces.forEach((a, k) => (k === id ? a.setAttribute('aria-current', 'true') : a.removeAttribute('aria-current')));
    const a = enlaces.get(id);
    if (a) carril.scrollTo({ left: a.offsetLeft - carril.offsetLeft - (carril.clientWidth - a.offsetWidth) / 2, behavior: quieto ? 'auto' : 'smooth' });
  }, { rootMargin: '-25% 0px -70% 0px' });
  enlaces.forEach((_, k) => { const sec = document.getElementById(k); if (sec) espia.observe(sec); });

  const abrirTodo = () => Promise.all([...app.querySelectorAll('img[data-img]')].map(async (im) => {
    try { if (!im.getAttribute('src')) im.src = await url(im.dataset.img); await im.decode(); } catch { /* sigue sin esa imagen */ }
  }));
  addEventListener('beforeprint', () => { app.querySelectorAll('details').forEach((d) => { d.open = true; }); abrirTodo(); });
  app.querySelectorAll('[data-imprimir]').forEach((b) => b.addEventListener('click', async () => {
    const t = b.textContent; b.disabled = true; b.textContent = 'Preparando…';
    app.querySelectorAll('details').forEach((d) => { d.open = true; });
    await abrirTodo();
    b.disabled = false; b.textContent = t; print();
  }));
}

// Mapa interactivo: Leaflet 1.9.4 (cdnjs) con fondo satelital o de calles de Esri; se carga cuando el mapa entra en
// pantalla. Las figuras, las capas y los pasos del recorrido vienen del contenido cifrado; aquí no hay datos.
// «Dónde estoy» usa la ubicación del teléfono solo en esta página; no se envía a ningún lado.
const cargar = (tag, attrs) => new Promise((ok, mal) => { const e = document.createElement(tag); Object.assign(e, attrs); e.onload = ok; e.onerror = mal; document.head.append(e); });
const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
async function montarMapa(caja, datos) {
  await new Promise((ok) => { const o = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting)) { o.disconnect(); ok(); } }, { rootMargin: '300px' }); o.observe(caja); });
  const V = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/';
  await cargar('link', { rel: 'stylesheet', href: V + 'leaflet.min.css', crossOrigin: 'anonymous' });
  await cargar('script', { src: V + 'leaflet.min.js', crossOrigin: 'anonymous' });
  const L = window.L, raiz = caja.closest('section') || app, msg = raiz.querySelector('[data-mapa-msg]');
  const avisar = (t) => { if (msg) msg.textContent = t; };
  const esri = (s) => `https://server.arcgisonline.com/ArcGIS/rest/services/${s}/MapServer/tile/{z}/{y}/{x}`;
  const atr = 'Imágenes y calles © Esri y sus fuentes';
  const sat = L.layerGroup([L.tileLayer(esri('World_Imagery'), { maxZoom: 19, attribution: atr }),
    L.tileLayer(esri('Reference/World_Transportation'), { maxZoom: 19, opacity: 0.8 }), L.tileLayer(esri('Reference/World_Boundaries_and_Places'), { maxZoom: 19 })]);
  const calles = L.tileLayer(esri('World_Street_Map'), { maxZoom: 19, attribution: atr });
  const mapa = L.map(caja, { layers: [sat], scrollWheelZoom: false, zoomSnap: 0.25 });
  L.control.layers({ 'Satélite': sat, 'Calles': calles }, null, { position: 'topright' }).addTo(mapa);
  L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(mapa);

  // Una capa de Leaflet por cada «capa» del GeoJSON; las medidas solo se ven de cerca.
  const capas = {}, medidas = L.layerGroup();
  let finca = null;
  for (const f of datos.features) {
    const p = f.properties, g = (capas[p.capa] ||= L.featureGroup());
    if (p.tipo === 'medida') {
      L.tooltip({ permanent: true, direction: p.dir || 'center', className: 'medida', offset: [0, 0] })
        .setLatLng([f.geometry.coordinates[1], f.geometry.coordinates[0]]).setContent(p.nombre).addTo(medidas);
      continue;
    }
    L.geoJSON(f, {
      style: () => (p.tipo === 'finca'
        ? { color: p.color, weight: 3, fillColor: p.color, fillOpacity: 0.3, dashArray: '9 6' }
        : { color: p.color, weight: 4, opacity: 0.95, dashArray: p.guiones ? '8 7' : null }),
      pointToLayer: (_, ll) => L.circleMarker(ll, { radius: 7, color: '#fff', weight: 2, fillColor: '#3e2723', fillOpacity: 1 }),
      onEachFeature: (_, l) => {
        l.bindPopup(p.nombre);
        if (p.tipo === 'finca') { finca = l; l.bindTooltip(p.etiqueta || p.nombre, { permanent: true, direction: 'center', className: 'etq' }); }
      },
    }).addTo(g);
  }
  // De cerca se ven las medidas de cada lado y el nombre de la finca se esconde para no taparlas.
  const verMedidas = () => {
    const z = mapa.getZoom() >= 16.25 && mapa.hasLayer(capas.finca);
    if (z && !mapa.hasLayer(medidas)) { medidas.addTo(mapa); finca?.closeTooltip(); }
    if (!z && mapa.hasLayer(medidas)) { medidas.remove(); if (mapa.hasLayer(capas.finca)) finca?.openTooltip(); }
  };
  mapa.on('zoomend', verMedidas);
  const casillas = [...raiz.querySelectorAll('[data-mapa-ley] input[data-capa]')];
  const mostrar = (lista) => {
    for (const [k, g] of Object.entries(capas)) { const si = lista.includes(k); if (si && !mapa.hasLayer(g)) g.addTo(mapa); if (!si && mapa.hasLayer(g)) g.remove(); }
    casillas.forEach((c) => { c.checked = lista.includes(c.dataset.capa); });
    verMedidas();
  };
  casillas.forEach((c) => c.addEventListener('change', () => mostrar(casillas.filter((x) => x.checked).map((x) => x.dataset.capa))));
  const ir = (lista) => {
    const b = L.latLngBounds([]);
    lista.forEach((k) => capas[k] && k !== 'ref' && b.extend(capas[k].getBounds()));
    if (!b.isValid()) return;
    const sola = lista.length === 1 && lista[0] === 'finca'; // de cerca, a los lados caben las medidas
    const opc = { padding: [sola ? Math.min(96, caja.clientWidth * 0.22) : 20, 28], maxZoom: 17 };
    quieto ? mapa.fitBounds(b, opc) : mapa.flyToBounds(b, { ...opc, duration: 1.1 });
  };

  // Recorrido: cada paso del contenido dice qué capas encender.
  const pasos = [...raiz.querySelectorAll('[data-recorrido] > li')];
  if (pasos.length) {
    const nav = document.createElement('div'); nav.className = 'rec-nav';
    nav.innerHTML = '<button type="button" data-ant>Anterior</button><span aria-live="polite"></span><button type="button" data-sig>Siguiente</button>';
    raiz.querySelector('[data-recorrido]').before(nav);
    const cont = nav.querySelector('span');
    let actual = 0;
    const paso = (k) => {
      actual = Math.max(0, Math.min(pasos.length - 1, k));
      pasos.forEach((li, n) => li.classList.toggle('activo', n === actual));
      cont.textContent = `${actual + 1} de ${pasos.length}`;
      nav.querySelector('[data-ant]').disabled = actual === 0; nav.querySelector('[data-sig]').disabled = actual === pasos.length - 1;
      const lista = pasos[actual].dataset.capas.split(',');
      mostrar(lista); ir((pasos[actual].dataset.ir || pasos[actual].dataset.capas).split(','));
    };
    nav.querySelector('[data-ant]').addEventListener('click', () => paso(actual - 1));
    nav.querySelector('[data-sig]').addEventListener('click', () => paso(actual + 1));
    mapa.fitBounds(finca.getBounds().pad(1.2));
    paso(0);
  } else { mostrar(Object.keys(capas)); mapa.fitBounds(finca ? finca.getBounds().pad(0.9) : L.featureGroup(Object.values(capas)).getBounds()); }

  // Pantalla completa.
  const cerrar = document.createElement('button'); cerrar.type = 'button'; cerrar.className = 'mapa-cerrar'; cerrar.textContent = 'Cerrar pantalla completa';
  caja.after(cerrar);
  const grande = (si) => { caja.classList.toggle('grande', si); mapa.scrollWheelZoom[si ? 'enable' : 'disable'](); setTimeout(() => mapa.invalidateSize(), 80); };
  cerrar.addEventListener('click', () => grande(false));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && caja.classList.contains('grande')) grande(false); });
  raiz.querySelector('[data-mapa-grande]')?.addEventListener('click', () => grande(true));

  // Dónde estoy: punto azul con su margen de error y distancia al borde de la finca.
  let yo = null;
  raiz.querySelector('[data-mapa-yo]')?.addEventListener('click', () => {
    if (!navigator.geolocation) { avisar('Este teléfono no da la ubicación.'); return; }
    avisar('Buscando su ubicación…');
    navigator.geolocation.getCurrentPosition((pos) => {
      const ll = L.latLng(pos.coords.latitude, pos.coords.longitude);
      yo?.remove();
      yo = L.layerGroup([L.circle(ll, { radius: pos.coords.accuracy, color: '#1a73e8', weight: 1, fillOpacity: 0.12 }),
        L.circleMarker(ll, { radius: 8, color: '#fff', weight: 3, fillColor: '#1a73e8', fillOpacity: 1 }).bindPopup('Usted está aquí')]).addTo(mapa);
      if (!finca) return;
      const a = finca.getLatLngs()[0];
      let dentro = false;
      for (let i = 0, j = a.length - 1; i < a.length; j = i++) if ((a[i].lat > ll.lat) !== (a[j].lat > ll.lat) && ll.lng < (a[j].lng - a[i].lng) * (ll.lat - a[i].lat) / (a[j].lat - a[i].lat) + a[i].lng) dentro = !dentro;
      // distancia al borde: al segmento más cercano, en metros (aproximación plana; sobra a esta escala)
      const P = mapa.options.crs.project.bind(mapa.options.crs), q = P(ll);
      const seg = (u, v) => { const A = P(u), B = P(v), dx = B.x - A.x, dy = B.y - A.y, t = Math.max(0, Math.min(1, ((q.x - A.x) * dx + (q.y - A.y) * dy) / (dx * dx + dy * dy || 1))); return Math.hypot(q.x - A.x - t * dx, q.y - A.y - t * dy); };
      const m = Math.min(...a.map((u, k) => seg(u, a[(k + 1) % a.length]))) * Math.cos(ll.lat * Math.PI / 180);
      avisar(dentro ? `Usted está dentro de la zona donde probablemente está la finca (precisión del teléfono: ±${Math.round(pos.coords.accuracy)} m).` : `Usted está a unos ${Math.round(m)} m del borde de la zona probable de la finca (precisión del teléfono: ±${Math.round(pos.coords.accuracy)} m).`);
      const b = L.latLngBounds([ll]).extend(finca.getBounds());
      quieto ? mapa.fitBounds(b.pad(0.25)) : mapa.flyToBounds(b.pad(0.25), { duration: 1 });
    }, () => avisar('No se pudo leer la ubicación. Revise que el teléfono le dé permiso a esta página.'), { enableHighAccuracy: true, timeout: 15000 });
  });

  // Bajar para Google Earth: KML hecho aquí mismo con las figuras del mapa.
  raiz.querySelector('[data-mapa-kml]')?.addEventListener('click', (e) => {
    const esc = (t) => String(t).replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
    const kc = (hex, a) => a + hex.slice(5, 7) + hex.slice(3, 5) + hex.slice(1, 3);
    const co = (c) => c.map(([x, y]) => `${x},${y},0`).join(' ');
    const pm = datos.features.filter((f) => f.properties.tipo !== 'medida').map((f, k) => {
      const p = f.properties, g = f.geometry, col = p.color || '#3e2723';
      const geo = g.type === 'Polygon' ? `<Polygon><outerBoundaryIs><LinearRing><coordinates>${co(g.coordinates[0])}</coordinates></LinearRing></outerBoundaryIs></Polygon>`
        : g.type === 'LineString' ? `<LineString><tessellate>1</tessellate><coordinates>${co(g.coordinates)}</coordinates></LineString>` : `<Point><coordinates>${co([g.coordinates])}</coordinates></Point>`;
      return `<Placemark><name>${esc(p.nombre)}</name><Style><LineStyle><color>${kc(col, 'ff')}</color><width>3</width></LineStyle><PolyStyle><color>${kc(col, '55')}</color></PolyStyle></Style>${geo}</Placemark>`;
    }).join('');
    const kml = `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${esc(e.currentTarget.dataset.titulo || 'Mapa')}</name>${pm}</Document></kml>`;
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' }));
    a.download = e.currentTarget.dataset.nombre || 'mapa.kml'; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  });
}
abrir().catch(() => { app.innerHTML = '<p class="cargando">No se pudo abrir la página. Recargue para intentarlo otra vez.</p>'; });
</script>
